const screenResults = document.getElementById('screenResults');
const navUser = document.getElementById('navUser');

function showScreen(el) {
  [screenName, screenDashboard, screenQuiz, screenResults].forEach(s => s.classList.add('hidden'));
  el.classList.remove('hidden');
}

function slugify(name) {
  return name.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
}

// ============ NAME SCREEN ============
document.getElementById('nameSubmit').addEventListener('click', submitName);
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitName(); });

async function submitName() {
  const raw = document.getElementById('nameInput').value;
  if (!raw.trim()) return;
  studentName = raw.trim().toUpperCase();
  studentId = slugify(raw);
  const statusEl = document.getElementById('nameStatus');
  statusEl.textContent = 'Cargando tu progreso...';

  try {
    const docRef = db.collection('students').doc(studentId);
    const docSnap = await docRef.get();
    if (docSnap.exists) {
      studentData = docSnap.data();
      if (!studentData.blocks) studentData.blocks = {};
    } else {
      studentData = { name: studentName, blocks: {}, createdAt: new Date().toISOString() };
      await docRef.set(studentData);
    }
    navUser.textContent = studentName;
    document.getElementById('dashName').textContent = studentName;
    renderDashboard();
    showScreen(screenDashboard);
  } catch (err) {
    statusEl.textContent = 'No se pudo conectar a la base de datos. Verifica tu conexión e intenta de nuevo.';
    console.error(err);
  }
}

    col.className = 'col-6 col-lg-3';
    col.innerHTML = `
      <div class="card block-card floating h-100 p-3 text-center ${locked ? 'locked card-muted' : ''}" data-key="${key}">
        <div class="progress-ring" style="--pct:${pct}; --ring-color:${ringColor};">
          <div class="progress-ring-inner">
            ${locked
              ? '<span style="font-size:22px;">🔒</span>'
              : `<span class="pct-value">${pct}%</span><span class="pct-label">${progress ? 'completado' : 'sin iniciar'}</span>`}
          </div>
        </div>
        <h6 class="mt-3 mb-0">${block.title}</h6>
        <p class="text-secondary small mb-0">${block.subtitle}</p>
        ${!locked ? `<p class="text-secondary small mb-0">${block.questions.length} preguntas</p>` : ''}
      </div>
    `;
    if (!locked) {
      col.querySelector('.block-card').addEventListener('click', () => startBlock(key));
    }
    row.appendChild(col);
  });
}

document.getElementById('backToDashboard').addEventListener('click', () => {
  showScreen(screenDashboard);
  renderDashboard();
});
document.getElementById('resBackBtn').addEventListener('click', () => {
  showScreen(screenDashboard);
  renderDashboard();
});

// ============ QUIZ ENGINE ============
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startBlock(key) {
  activeBlockKey = key;
  activeQuestions = shuffle(QUESTION_BANK[key].questions);
  current = 0; score = 0; answered = false; userAnswers = [];
  showScreen(screenQuiz);
  renderQuestion();
}

function normalize(s) { return s.trim().toLowerCase().replace(/[.!?]/g, ''); }

function getShuffledOptions(q) {
  const withFlags = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
  return shuffle(withFlags);
}

function renderQuestion() {
  answered = false;
  selectedOption = null;
  const q = activeQuestions[current];

  document.getElementById('quizProgressLabel').textContent = `ITEM ${current + 1}/${activeQuestions.length}`;
  document.getElementById('quizProgressBar').style.width = (current / activeQuestions.length * 100) + '%';
  document.getElementById('catTag').textContent = q.cat;
  const typeLabels = { mc: 'Multiple choice', correction: 'Spot the error', fill: 'Fill in the blank' };
  document.getElementById('typeTag').textContent = typeLabels[q.type];

  document.getElementById('feedbackBox').classList.add('hidden');
  document.getElementById('feedbackBox').className = 'alert mt-3 hidden';
  document.getElementById('actionBtn').textContent = 'Comprobar respuesta';

  const sentenceWrap = document.getElementById('sentenceWrap');
  const questionText = document.getElementById('questionText');
  const mcOptions = document.getElementById('mcOptions');
  const fillArea = document.getElementById('fillArea');
  const fillInput = document.getElementById('fillInput');

  if (q.type === 'correction') {
    sentenceWrap.classList.remove('hidden');
    document.getElementById('sentenceBox').innerHTML = q.sentence.replace(q.flagged, '<span class="flagged-word">' + q.flagged + '</span>');
    questionText.textContent = 'Which spelling is correct?';
    mcOptions.classList.remove('hidden');
    fillArea.classList.add('hidden');
    currentOptions = getShuffledOptions(q);
    buildOptions(currentOptions);
  } else if (q.type === 'mc') {
    sentenceWrap.classList.add('hidden');
    questionText.textContent = q.text;
    mcOptions.classList.remove('hidden');
    fillArea.classList.add('hidden');
    currentOptions = getShuffledOptions(q);
    buildOptions(currentOptions);
  } else {
    sentenceWrap.classList.add('hidden');
    mcOptions.classList.add('hidden');
    fillArea.classList.remove('hidden');
    const parts = q.text.split('{blank}');
    questionText.innerHTML = parts[0] + ' <u>______</u> ' + parts[1] + ' <span class="text-secondary small">(' + q.hint + ')</span>';
    fillInput.value = '';
    fillInput.className = 'form-control form-control-lg';
    fillInput.disabled = false;
    setTimeout(() => fillInput.focus(), 50);
  }
}

function buildOptions(options) {
  const mcOptions = document.getElementById('mcOptions');
  mcOptions.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  options.forEach((opt, i) => {
    const item = document.createElement('div');
    item.className = 'list-group-item';
    item.innerHTML = `<strong class="me-2">${letters[i]}.</strong> ${opt.text}`;
    item.addEventListener('click', () => {
      if (answered) return;
      document.querySelectorAll('#mcOptions .list-group-item').forEach(o => o.classList.remove('selected'));
      item.classList.add('selected');
      selectedOption = i;
    });
    mcOptions.appendChild(item);
  });
}

document.getElementById('actionBtn').addEventListener('click', () => {
  if (!answered) checkAnswer();
  else goNext();
});
document.getElementById('fillInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !answered) checkAnswer();
});

function checkAnswer() {
  const q = activeQuestions[current];
  let isCorrect = false, userAnswerText = '';

  if (q.type === 'fill') {
    const val = document.getElementById('fillInput').value;
    if (!val.trim()) return;
    userAnswerText = val;
    isCorrect = q.answers.some(a => normalize(a) === normalize(val));
    document.getElementById('fillInput').classList.add(isCorrect ? 'is-valid' : 'is-invalid');
    document.getElementById('fillInput').disabled = true;
  } else {
    if (selectedOption === null) return;
    isCorrect = currentOptions[selectedOption].isCorrect;
    userAnswerText = currentOptions[selectedOption].text;
    const correctIndex = currentOptions.findIndex(o => o.isCorrect);
    document.querySelectorAll('#mcOptions .list-group-item').forEach((o, i) => {
      if (i === correctIndex) o.classList.add('correct');
      else if (i === selectedOption && !isCorrect) o.classList.add('incorrect');
    });
  }

  answered = true;
  if (isCorrect) score++;
  userAnswers.push({ q, isCorrect, userAnswerText });

  const box = document.getElementById('feedbackBox');
  box.classList.remove('hidden');
  box.className = 'alert mt-3 ' + (isCorrect ? 'alert-success' : 'alert-danger');
  document.getElementById('feedbackTitle').textContent = isCorrect ? '✔ Correct' : '✘ Incorrect';

  let note = '';
  if (q.type === 'fill') note = (isCorrect ? '' : 'Correct answer: "' + q.answers[0] + '". ') + q.explain;
  else if (q.type === 'correction') note = (isCorrect ? '' : 'Correct spelling: "' + q.options[q.correct] + '". ') + q.explain;
  else note = isCorrect ? 'That is correct.' : 'Correct answer: "' + q.options[q.correct] + '".';
  document.getElementById('feedbackNote').textContent = note;

  document.getElementById('actionBtn').textContent = current === activeQuestions.length - 1 ? 'Ver resultado' : 'Siguiente pregunta';
}

function goNext() {
  current++;
  if (current >= activeQuestions.length) finishBlock();
  else renderQuestion();
}

async function finishBlock() {
  const pct = Math.round((score / activeQuestions.length) * 100);
  studentData.blocks[activeBlockKey] = {
    score, total: activeQuestions.length, pct,
    completedAt: new Date().toISOString()
  };

  try {
    await db.collection('students').doc(studentId).set(studentData, { merge: true });
  } catch (err) {
    console.error('Error guardando progreso:', err);
  }

  showResults(pct);
}

function showResults(pct) {
  showScreen(screenResults);
  document.getElementById('resScore').textContent = pct + '%';
  document.getElementById('resDetail').textContent = `${score} de ${activeQuestions.length} respuestas correctas — ${QUESTION_BANK[activeBlockKey].title}`;

  const tierEl = document.getElementById('resTier');
  if (pct >= 90) { tierEl.className = 'alert alert-success'; tierEl.textContent = 'Excelente — dominio sólido de este bloque.'; }
  else if (pct >= 70) { tierEl.className = 'alert alert-info'; tierEl.textContent = 'Bueno — repasa los puntos débiles.'; }
  else if (pct >= 50) { tierEl.className = 'alert alert-warning'; tierEl.textContent = 'Regular — necesitas más repaso.'; }
  else { tierEl.className = 'alert alert-danger'; tierEl.textContent = 'Necesitas repasar este bloque a fondo.'; }

  const missed = userAnswers.filter(a => !a.isCorrect);
  const missedWrap = document.getElementById('resMissed');
  missedWrap.innerHTML = '';
  if (missed.length) {
    const title = document.createElement('p');
    title.className = 'text-secondary text-uppercase small mt-4 mb-2';
    title.textContent = 'Repaso de fallos';
    missedWrap.appendChild(title);
    missed.forEach(a => {
      let qText, correctText;
      if (a.q.type === 'fill') { qText = a.q.text.replace('{blank}', '____'); correctText = a.q.answers[0]; }
      else if (a.q.type === 'correction') { qText = a.q.sentence; correctText = a.q.options[a.q.correct]; }
      else { qText = a.q.text; correctText = a.q.options[a.q.correct]; }
      const div = document.createElement('div');
      div.className = 'border-bottom border-secondary-subtle py-2 small';
      div.innerHTML = `<p class="mb-1 text-secondary">${qText}</p><p class="mb-0">Tu respuesta: "${a.userAnswerText}" &middot; Correcta: <strong class="text-accent">${correctText}</strong></p>`;
      missedWrap.appendChild(div);
    });
  }
}
</script>
